name: Scheduled Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
  schedule:
    # 9:00 AM ET (14:00 UTC) every day
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        run: curl -X POST "${{ secrets.CF_DEPLOY_HOOK_URL }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Submit new URLs to IndexNow
        run: python scripts/submit_indexnow.py
