name: Twitter Thread from Video

on:
  schedule:
    # 13:30 UTC = 8:30 AM ET — 30 min after daily video roundup
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      json_file:
        description: 'Video JSON file path (e.g. video/data/trending-iran-war-2026-03-03.json)'
        required: false

jobs:
  post-thread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy python-dotenv

      - name: Find latest video JSON
        id: find-json
        run: |
          if [ -n "${{ inputs.json_file }}" ]; then
            echo "file=${{ inputs.json_file }}" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date -u +%Y-%m-%d)
            # Look for today's trending or roundup JSON
            LATEST=$(ls -t video/data/trending-*-${TODAY}.json video/data/roundup-${TODAY}.json 2>/dev/null | head -1)
            if [ -z "$LATEST" ]; then
              # Fallback: most recent file of any date
              LATEST=$(ls -t video/data/trending-*.json video/data/roundup-*.json 2>/dev/null | head -1)
            fi
            if [ -z "$LATEST" ]; then
              echo "No video JSON found"
              exit 0
            fi
            echo "file=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Twitter thread
        if: steps.find-json.outputs.file != ''
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_twitter_thread.py "${{ steps.find-json.outputs.file }}"
