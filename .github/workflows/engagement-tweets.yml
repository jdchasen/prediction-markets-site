name: Engagement Tweets

on:
  schedule:
    # 10:00 AM ET = 15:00 UTC — morning market open recap
    - cron: '0 15 * * *'
    # 2:00 PM ET = 19:00 UTC — midday action
    - cron: '0 19 * * *'
    # 7:00 PM ET = 00:00 UTC (next day) — evening wrap
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Time slot'
        required: false
        type: choice
        options:
          - morning
          - midday
          - evening

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine slot
        id: slot
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            echo "value=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq 15 ]; then
              echo "value=morning" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" -eq 19 ]; then
              echo "value=midday" >> "$GITHUB_OUTPUT"
            else
              echo "value=evening" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Post engagement tweet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python scripts/tweet_engagement.py --slot ${{ steps.slot.outputs.value }}
