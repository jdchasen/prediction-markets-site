name: Daily Market Pulse

on:
  schedule:
    # 8:00 AM ET (13:00 UTC) — one hour before the 9 AM deploy
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate daily pulse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_pulse.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/daily-market-pulse-*.md
          git diff --cached --quiet && echo "No new pulse to commit" && exit 0
          git commit -m "Add daily market pulse for $(date -u +%Y-%m-%d)"
          git push
