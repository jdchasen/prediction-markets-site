name: Daily Odds Pages

on:
  schedule:
    # 11:30 UTC = 6:30 AM ET — morning run before daily article workflow (7 AM ET)
    - cron: '30 11 * * *'
    # 21:00 UTC = 4:00 PM ET — afternoon refresh
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write

jobs:
  generate-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography anthropic

      - name: Generate odds pages
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_odds_pages.py

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/markets/
          if git diff --cached --quiet; then
            echo "No odds page changes to commit"
          else
            git commit -m "Update odds pages for $(date -u +%Y-%m-%d)"
            git push
          fi
