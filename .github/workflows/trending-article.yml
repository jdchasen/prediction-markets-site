name: Trending Market Article

on:
  schedule:
    # 14:00 UTC = 9:00 AM ET (after daily pulse, when news cycle is active)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-trending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate trending article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/trending_article.py

      - name: Commit and push if new article
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/*.md
          if git diff --cached --quiet; then
            echo "No new trending article to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add trending market article for $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit new URLs to IndexNow
        if: steps.commit.outputs.pushed == 'true'
        run: python scripts/submit_indexnow.py
