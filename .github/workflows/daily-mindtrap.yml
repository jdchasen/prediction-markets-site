name: Daily MindTrap Video

on:
  schedule:
    # 23:00 UTC = 7:00 PM ET — evening prime time
    - cron: '0 23 * * *'  # Every day
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-render-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Python: Generate mindtrap JSON ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate mindtrap data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_mindtrap_video.py

      # --- Node.js: Render video + Upload ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install video dependencies
        working-directory: video
        run: npm ci

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render video
        working-directory: video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          JSON_FILE=$(ls -t data/mindtrap-*-${TODAY}.json 2>/dev/null | head -1)
          if [ -z "$JSON_FILE" ]; then
            echo "No mindtrap JSON for today ($TODAY), checking for latest..."
            JSON_FILE=$(ls -t data/mindtrap-*.json 2>/dev/null | head -1)
          fi
          if [ -z "$JSON_FILE" ]; then
            echo "No mindtrap JSON found"
            exit 1
          fi
          echo "Rendering: $JSON_FILE"
          npx tsx render.ts --topic "$JSON_FILE"

      - name: Upload to YouTube
        working-directory: video
        if: ${{ env.YOUTUBE_MT_REFRESH_TOKEN != '' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_MT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_MT_REFRESH_TOKEN }}
        run: npx tsx upload-youtube.ts --latest-mindtrap

      # --- Save artifacts for debugging ---
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-mindtrap-video
          path: scripts/output/videos/rendered/shorts/*mindtrap*.mp4
          retention-days: 7
