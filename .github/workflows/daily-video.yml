name: Daily Video Roundup

on:
  schedule:
    # 13:00 UTC = 8:00 AM ET — post before market open for maximum engagement
    - cron: '0 13 * * 1-5'  # Weekdays only (markets are most active)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-render-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Python: Generate roundup JSON ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate roundup data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python scripts/generate_roundup_video.py

      # --- Node.js: Render video + Upload ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install video dependencies
        working-directory: video
        run: npm ci

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render video
        working-directory: video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          # Find today's roundup JSON
          TODAY=$(date -u +%Y-%m-%d)
          JSON_FILE="data/roundup-${TODAY}.json"
          if [ ! -f "$JSON_FILE" ]; then
            echo "No roundup JSON for today ($TODAY), checking for latest..."
            JSON_FILE=$(ls -t data/roundup-*.json 2>/dev/null | head -1)
          fi
          if [ -z "$JSON_FILE" ]; then
            echo "No roundup JSON found"
            exit 1
          fi
          echo "Rendering: $JSON_FILE"
          npx tsx render.ts --roundup "$JSON_FILE"

      - name: Upload to YouTube
        working-directory: video
        if: ${{ env.YOUTUBE_REFRESH_TOKEN != '' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx upload-youtube.ts --latest

      - name: Upload to TikTok
        working-directory: video
        if: ${{ env.TIKTOK_ACCESS_TOKEN != '' }}
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: npx tsx upload-tiktok.ts --latest

      - name: Post Twitter thread
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          pip install tweepy
          TODAY=$(date -u +%Y-%m-%d)
          JSON_FILE=$(ls -t video/data/roundup-${TODAY}.json video/data/trending-*-${TODAY}.json 2>/dev/null | head -1)
          if [ -n "$JSON_FILE" ]; then
            python scripts/post_twitter_thread.py "$JSON_FILE"
          else
            echo "No video JSON found for thread"
          fi

      # --- Save artifacts for debugging ---
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-roundup-video
          path: scripts/output/videos/rendered/shorts/*.mp4
          retention-days: 7
